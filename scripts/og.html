<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>VidaFrame social image</title>
    <style>
      @font-face {
        font-family: "Fraunces Variable";
        src: url("../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-full-normal.woff2")
          format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: "Source Sans 3 Variable";
        src: url("../node_modules/@fontsource-variable/source-sans-3/files/source-sans-3-latin-wght-normal.woff2")
          format("woff2");
        font-weight: 200 900;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(700px 420px at 78% 18%, rgba(232, 184, 109, 0.18), transparent 70%),
          linear-gradient(180deg, #3c291c 0%, #2a1c16 42%, #12151c 100%);
        color: #f4efe6;
        font-family: "Source Sans 3 Variable", sans-serif;
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(232, 184, 109, 0.45);
        border-radius: 36px;
      }
      .company {
        position: absolute;
        top: 52px;
        left: 64px;
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .inner {
        position: relative;
        text-align: center;
      }
      h1 {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 0.14em;
        margin: 0;
        font-family: "Fraunces Variable", Georgia, serif;
        font-size: 148px;
        font-weight: 520;
        font-variation-settings: "opsz" 144, "SOFT" 30, "WONK" 1, "wght" 520;
        letter-spacing: -0.04em;
        line-height: 0.85;
      }
      .frame-word {
        color: #e8b86d;
        font-size: 0.46em;
        font-weight: 500;
      }
      .tagline {
        margin: 28px 0 0;
        font-size: 34px;
        font-weight: 450;
        line-height: 1.3;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 28px;
        border: 1px solid rgba(232, 184, 109, 0.72);
        border-radius: 999px;
        padding: 8px 16px;
        color: #e8b86d;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e8b86d;
      }
    </style>
  </head>
  <body>
    <div class="frame"></div>
    <p class="company">Anagraphe Tech</p>
    <div class="inner">
      <h1><span>Vida</span><span class="frame-word">Frame</span></h1>
      <p class="tagline">Your photos, full screen.<br />The house, one swipe away.</p>
      <p class="badge">Coming soon to iPad</p>
    </div>
  </body>
</html>
